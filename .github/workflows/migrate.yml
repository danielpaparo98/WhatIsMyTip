name: Database Migrations

# Runs Alembic migrations against the production database.
#
# DEPLOY ORDER (fixed 2026-09): migrations run as a callable workflow
# invoked by deploy.yml BEFORE the new image is rolled out — the old
# `workflow_run` trigger fired *after* "Deploy Backend" completed, i.e.
# deploy-then-migrate, the opposite of what the original comment
# promised.  Requires migrations to be backward-compatible with the
# currently-running image (expand/contract style).
#
# Also runnable standalone via workflow_dispatch for manual backfills.

on:
  workflow_call: {}  # invoked by deploy.yml before the deploy job
  workflow_dispatch:
    inputs:
      target:
        description: 'Alembic revision target (default: head)'
        required: false
        default: 'head'

jobs:
  migrate:
    name: Run Alembic migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project && uv sync --frozen --no-dev

      - name: Verify DATABASE_URL is set
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ERROR: DATABASE_URL secret is not set"
            exit 1
          fi
          echo "DATABASE_URL is configured"

      - name: Show current migration state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic current

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade ${{ github.event.inputs.target || 'head' }}

      - name: Verify migration completed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CURRENT=$(uv run alembic current 2>/dev/null | grep -oP '^\S+' || echo "unknown")
          echo "Migration completed. Current revision: $CURRENT"
