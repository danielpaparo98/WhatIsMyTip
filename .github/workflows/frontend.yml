name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test:
    name: Lint + Type Check + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint || echo "Lint not configured, skipping"

      - name: Run type check
        run: bun run typecheck || echo "Typecheck not configured, skipping"

      - name: Run unit tests
        run: bun run test:unit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build
        env:
          NUXT_PUBLIC_API_BASE: https://whatismytip.com

      - name: Verify build output
        run: |
          if [ ! -d ".output" ]; then
            echo "ERROR: Build did not produce .output directory"
            exit 1
          fi
          echo "✅ Build succeeded, .output directory created"

  deploy:
    name: Deploy frontend (DigitalOcean App Platform)
    # CI previously built and verified the frontend but never shipped
    # it — deploys happened manually from the DO dashboard, so what CI
    # validated and what was live could drift.  The DO app is one unit
    # (frontend static site + backend container), so triggering an app
    # deployment ships the frontend component too.
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform deployment
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          DEPLOYMENT_ID=$(doctl apps create-deployment "$DO_APP_ID" --format ID --no-header)
          echo "Triggered deployment: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Wait for deployment to complete
        env:
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          for i in $(seq 1 50); do
            STATUS=$(doctl apps get-deployment "$DO_APP_ID" "$DEPLOYMENT_ID" --format Phase --no-header 2>/dev/null || echo "unknown")
            echo "Deployment status: $STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "Deployment is active"
              exit 0
            fi
            if [ "$STATUS" = "ERROR" ]; then
              echo "ERROR: Deployment failed"
              exit 1
            fi
            sleep 12
          done
          echo "ERROR: Deployment timed out after 10 minutes"
          exit 1

      - name: Smoke test production site
        run: |
          for i in $(seq 1 30); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" https://whatismytip.com 2>/dev/null || echo "failed")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Production site is serving (HTTP $HTTP)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP"
            sleep 10
          done
          echo "❌ Production site smoke test failed after 5 minutes" >&2
          exit 1
