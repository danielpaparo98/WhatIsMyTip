name: Backend CI

# DEPLOY MODEL (simplified 2026-09): DigitalOcean deploys natively on
# push to main (deploy_on_push: true in the app spec) and the backend
# container runs `alembic upgrade head` at startup
# (RUN_MIGRATIONS_ON_START=true) BEFORE uvicorn serves — DO's health
# check gates the rollout, so migrations always precede traffic.
#
# CI's job is therefore quality gates only: unit tests, integration
# tests (real Postgres + Redis), and a Docker build + boot smoke test.
# No registry push, no deploy trigger, no GitHub secrets required.

# CI concurrency guard: prevent two main runs racing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests + lint + type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -m "not integration"

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy packages/ --ignore-missing-imports

  integration-test:
    name: Run integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: whatismytip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/whatismytip_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: uv run pytest tests/integration/ -v --tb=short -k "test_api_" --timeout=60

  docker-smoke:
    name: Docker build + health smoke test
    runs-on: ubuntu-latest
    needs: integration-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build the FastAPI image
        run: docker build -t whatismytip-api:ci-smoke -f Dockerfile .

      - name: Run container and verify health endpoint
        run: |
          # DUP-MIG: the image now defaults to startup migrations;
          # the smoke DB is empty/unreachable, so pin them off here.
          docker run -d --name smoke-test \
            -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://localhost/whatismytip \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e RUN_MIGRATIONS_ON_START=false \
            whatismytip-api:ci-smoke

          # Wait for container to be healthy
          for i in $(seq 1 30); do
            HEALTH=$(curl -sf http://localhost:8000/health 2>/dev/null || echo "failed")
            if [ "$HEALTH" != "failed" ]; then
              echo "Health endpoint responding: $HEALTH"
              docker stop smoke-test
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Container did not start within 60s"
          docker logs smoke-test
          docker stop smoke-test || true
          exit 1
